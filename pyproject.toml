[project]
name = "idea-finder"
version = "0.0.0"
description = "Pain harvesting, clustering, and scoring pipeline for the Russian market"
readme = "AGENTS.md"
requires-python = ">=3.12, <3.13"
# Runtime dependencies arrive with tasks B/C/D; the skeleton needs none.
dependencies = [
    "pgserver>=0.1.4",
    "pgvector>=0.3",
    "psycopg[binary]>=3.1",
    # OpenAI-compatible LLM client (idea_finder.llm.client).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idea_finder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.rules]
# Strict mode: promote every non-error default to error.
abstract-and-final-method = "error"
ambiguous-protocol-member = "error"
blanket-ignore-comment = "error"
deprecated = "error"
disjoint-cast = "error"
division-by-zero = "error"
dynamic-function-decorator-return = "error"
experimental-syntax = "error"
ignore-comment-unknown-rule = "error"
ineffective-final = "error"
invalid-enum-member-annotation = "error"
invalid-ignore-comment = "error"
invalid-legacy-positional-parameter = "error"
invalid-named-tuple-override = "error"
mismatched-type-name = "error"
missing-direct-dependency = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-implicit-call = "error"
possibly-missing-import = "error"
possibly-missing-submodule = "error"
possibly-unresolved-reference = "error"
pydantic-discarded-extra-argument = "error"
redundant-cast = "error"
redundant-condition = "error"
redundant-condition-strict = "error"
redundant-final-classvar = "error"
subclass-of-dataclass-with-order = "error"
undefined-reveal = "error"
unresolved-global = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-base = "error"
unsupported-dynamic-base = "error"
unused-awaitable = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"
useless-overload-body = "error"
