[project]
name = "idea-finder"
version = "0.0.0"
description = "Pain harvesting, clustering, and scoring pipeline for the Russian market"
readme = "AGENTS.md"
requires-python = ">=3.12"
# Runtime dependencies arrive with tasks B/C/D; the skeleton needs none.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.1a5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idea_finder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
